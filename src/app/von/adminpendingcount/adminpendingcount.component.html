<div class="relative h-[100vh] w-full bg-gray-200 overflow-auto">
  <!-- <app-loader [isloading]="isloading"></app-loader> -->

  <!-- <div>
    <h1 class="text-3xl ml-10 font-semibold">Admin Pending count</h1>
  </div> -->

  <div class="m-2 flex flex-col items-center rounded-lg bg-white shadow-lg p-2">
    <div class="bg-gray-50 h-auto rounded-lg shadow-lg w-full overflow-hidden">
      <p-table
        [scrollable]="true"
        scrollHeight="600px"
        [value]="pendingcount"
         [paginator]="true"
        [rows]="10"
        [rowsPerPageOptions]="[10, 20, 40, 50, 100]"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [showGridlines]="true"
        paginatorDropdownAppendTo="body"
        scrollDirection="both"
        class="!w-[90vw]"
        sortable="true"
        [tableStyle]="{ 'min-width': '50rem' }"
        [globalFilterFields]="['Brand', 'dealer', 'location', 'pending']"
      >
        <ng-template #header>
          <tr class="bg-gray-200 text-gray-800 text-sm font-semibold">
            <th
              class="!px-1 !py-1 !text-center !min-w-[60px] !min-h-auto !bg-gray-300 text-[14px]"
            >
              S.No
            </th>
            <th
              class="!px-1 !py-1 !text-center !min-w-[60px] !min-h-auto !bg-gray-300 text-[14px]"
            >
              Brand
              <p-columnFilter type="text" field="Brand" display="menu" />
            </th>
            <th
              class="!px-1 !py-1 !text-center !min-w-[60px] !min-h-auto !bg-gray-300 text-[14px]"
            >
              Dealer
              <p-columnFilter type="text" field="dealer" display="menu" />
            </th>
            <th
              class="!px-1 !py-1 !text-center !min-w-[60px] !min-h-auto !bg-gray-300 text-[14px]"
            >
              Location
              <p-columnFilter type="text" field="location" display="menu" />
            </th>
            <th
              class="!px-1 !py-1 !text-center !min-w-[60px] !min-h-auto !bg-gray-300 text-[14px]"
            >
              Pending Count
              <p-columnFilter type="text" field="Pending" display="menu" />
            </th>
          </tr>
        </ng-template>

        <ng-template #body let-rowData let-i="rowIndex">
          <tr
            class="border-b hover:bg-green-100 transition duration-200 cursor-pointer"
            (click)="navigateToAvon(rowData)"
          >
            <td class="p-1 text-[12px] text-center">{{ i + 1 }}</td>
            <td class="p-1 text-[12px] text-center">{{ rowData.Brand }}</td>
            <td class="p-1 text-[12px] text-center">{{ rowData.dealer }}</td>
            <td class="p-1 text-[12px] text-center">{{ rowData.location }}</td>
            <td class="p-1 text-[12px] text-center">{{ rowData.Pending }}</td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>

<app-sidebar-2
  [sidebarvisible]="sidebarvisible"
  (close)="sidebarvisible = false"
></app-sidebar-2>
