<div class="relative h-auto w-full overflow-auto">
  <!-- <app-loader [isloading]="isloading"></app-loader> -->

  <div class="flex flex-wrap items-start justify-between p-3">
    <!-- <div>
      <h1 class="text-3xl ml-10 font-semibold">Remark Creation</h1>
    </div> -->

    <div
      class="min-w-full min-h-[15vh] flex-wrap flex p-2 gap-3 items-center bg-white rounded shadow-sm"
    >
      <form
        action=""
        [formGroup]="adminRemarkInputData"
        class="flex flex-wrap items-center gap-2 w-full"
      >
        <div class="flex-col">
          <p-floatlabel variant="on">
            <p-select
              formControlName="type"
              [options]="typeData"
              optionValue="code"
              showClear="true"
              appendTo="body"
              optionLabel="name"
              class="!w-40 h-8 !text-xs"
              [ngClass]="{
                'p-invalid':
                  adminRemarkInputData.get('type')?.invalid &&
                  adminRemarkInputData.get('type')?.touched
              }"
              inputId="type"
            />
            <label for="type" class="text-xs !font-normal">Type</label>
          </p-floatlabel>

          <!-- Validation message -->
          <div
            *ngIf="
              adminRemarkInputData.get('type')?.invalid &&
              adminRemarkInputData.get('type')?.touched
            "
            class="text-red-500 text-[10px] mt-1"
          >
            Type is required.
          </div>
        </div>

        <p-floatlabel variant="on">
          <p-select
            formControlName="brand"
            [options]="brandData"
            showClear="true"
            appendTo="body"
            optionValue="bigid"
            optionLabel="vcbrand"
            class="!w-40 h-8 !text-xs"
          />
          <label for="brand" class="text-xs !font-normal">Brand</label>
        </p-floatlabel>

        <div class="card flex flex-col justify-center">
          <textarea
            rows="5"
            cols="30"
            pTextarea
            [attr.aria-placeholder]="'Enter your name'"
            placeholder="Enter Remark"
            class="h-8 text-xs rounded-sm p-2 w-72"
            formControlName="remarkInput"
          ></textarea>
          <div *ngIf="adminRemarkInputData.get('remarkInput')?.errors">
            <div
              class="text-red-500 text-xs"
              *ngIf="adminRemarkInputData.get('remarkInput')?.errors?.['maxLength']"
            >
              Maximum 50 characters allowed.
            </div>
            <div
              *ngIf="adminRemarkInputData.get('remarkInput')?.errors?.['invalidCharacters']"
              class="text-red-500 text-xs"
            >
              Only alphanumeric characters "," "-" and " " are allowed.
            </div>
          </div>
        </div>

        <div class="">
          <p-button
            label="Submit"
            size="small"
            [disabled]="adminRemarkInputData.invalid"
            (click)="onSubmitRemarkData()"
            class=""
          />
        </div>
        <div class="">
          <p-button
            label="Show Table"
            size="small"
            [disabled]="adminRemarkInputData.invalid"
            (click)="onclickShowTable()"
            class=""
          />
        </div>
      </form>
      <div class="flex justify-center w-full" *ngIf="showtable">
      <div
        class="!w-auto h-auto  flex items-center justify-center p-3 bg-gray-50 rounded-lg shadow-lg mb-5" style="zoom: 0.77"
      >
        <div class="p-text-secondary mb-8">
          <p-table
            #dt
            [tableStyle]="{ 'min-width': '70rem' }"
            [scrollable]="true"
            [value]="remarkData"
            [rowHover]="true"
            scrollHeight="400px"
            [globalFilterFields]="['vcbrand', 'remark', 'AddedBy']"
          >
            <ng-template #caption>
              <div class="flex justify-between">
                <p-button
                  [outlined]="true"
                  icon="pi pi-filter-slash"
                  label="Clear"
                  (click)="clear(dt)"
                />
              </div>
            </ng-template>

            <ng-template #header>
              <tr class="bg-gray-400">
                <th>
                  Brand<p-columnFilter
                    type="text"
                    field="vcbrand"
                    display="menu"
                  />
                </th>
                <th>
                  Remark<p-columnFilter
                    type="text"
                    field="remark"
                    display="menu"
                  />
                </th>
                <th>
                  Added By
                  <p-columnFilter type="text" field="AddedBy" display="menu" />
                </th>
                <th>Added On</th>
              </tr>
            </ng-template>
            <ng-template #body let-data>
              <tr>
                <td>{{ data.vcbrand }}</td>
                <td>{{ data.remark }}</td>
                <td>{{ data.AddedBy }}</td>
                <td>
                  {{ data.addedon | date : "dd-MMM-yy / h:mm a" : "UTC" }}
                </td>

                <!-- <td>{{ data.AdminRemark }}</td> -->
              </tr>
            </ng-template>
          </p-table>
        </div>
      </div>
    </div>
    </div>
  </div>

  <!-- it is for error Message -->
  <p-dialog
    header="Message"
    [(visible)]="visible"
    [modal]="true"
    [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
    [style]="{ width: '30vw' }"
    [draggable]="false"
    [resizable]="false"
  >
    <p class="text-lg font-semibold">
      {{ Result }}
    </p>
  </p-dialog>

  <!-- <app-sidebar-2 [sidebarvisible]="sidebarvisible" (close)="sidebarvisible = false"></app-sidebar-2> -->
</div>
