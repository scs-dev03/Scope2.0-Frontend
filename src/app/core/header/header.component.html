  <header
  class="sticky top-0 z-50 bg-white/80 backdrop-blur-sm border-b border-slate-200"
>
  <div class="mx-auto max-w-7xl px-3 sm:px-6 lg:px-8">
    <div class="h-12 flex items-center justify-between gap-3">
      <!-- Left: menu + module name -->
      <div class="flex items-center gap-5">
        <!-- Logo -->
        <img
              src="Scs-logo.png"
              alt="Logo"
              [routerLink]="['/core/home']"
              class="w-auto h-16"
            />

        <!-- Sidebar toggle -->
        <button
          *ngIf="!isLoginPage"
          type="button"
          (click)="toggleSidebar()"
          class="inline-flex h-10 w-10 items-center justify-center rounded-xl bg-teal-600 text-white shadow hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2"
          aria-label="Toggle sidebar"
        >
          <ng-container *ngIf="!visibleSidebar; else arrowIcon">
            <!-- menu icon -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </ng-container>
          <ng-template #arrowIcon>
            <!-- arrow-left icon -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path d="M14 6l-6 6 6 6M20 12H9" />
            </svg>
          </ng-template>
        </button>

        <!-- Module name -->
        <span
          *ngIf="!isLoginPage"
          class="text-xl sm:text-xl font-semibold tracking-tight text-slate-800"
        >
          <!-- {{ moduleName }} -->
        </span>
      </div>

      <!-- Right: home page actions -->
      <div  class="flex items-center gap-3">
        <button
          type="button"
          (click)="redirectToLegacyScope()"
          class="inline-flex items-center gap-2 rounded-xl bg-teal-600 px-3.5 py-2 text-sm font-medium text-white shadow hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path
              d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3ZM19 19H5V5h7V3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7Z"
            />
          </svg>
        </button>

        <div class="w-auto flex ">
          <p-avatar image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png" class="mr-2"  shape="circle" />
          
         

        </div>
      </div>
    </div>
  </div>
</header>
