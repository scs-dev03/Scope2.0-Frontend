<div class="card flex justify-start">
    <p-drawer #drawerRef [(visible)]="sidebarvisible" class="!duration-2000">
      <ng-template #headless>
        <div class="flex flex-col h-full !bg-green-100">
          <div class="flex items-center justify-between px-6 pt-4 shrink-0">
            <span class="inline-flex items-center gap-2">
              <img src="logo/sparecare_horizontal_logo.png" alt="" />
            </span>
            <span>
             
            </span>
          </div>
          <div class="overflow-y-auto">
            <div class="flex justify-center !bg-green-100">
              <p-panelmenu
                [model]="items"
                [style]="{'width':'300px',}"
                [multiple]="true"
              />
            </div>
          </div>
  
          <div class="mt-auto">
            <hr class="mb-4 mx-4 border-t border-0 border-surface" />
            <a
              pRipple
              class="m-4 flex items-center cursor-pointer p-4 gap-2 rounded-border text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple"
            >
              <p-avatar
                image="https://primefaces.org/cdn/primeng/images/demo/avatar/xuxuefeng.png"
                shape="circle"
              />
              <span class="font-bold text-black">{{username}}</span>
            </a>
          </div>
        </div>
      </ng-template>
    </p-drawer>
  </div>
