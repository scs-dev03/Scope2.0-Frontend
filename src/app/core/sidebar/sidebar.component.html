<div class="sidebar">
  <div class="logo-section ms-4">
    <img
      src="Scs-logo.png"
      alt="Logo"
      class="sidebar-logo cursor-pointer"
      [routerLink]="['/core/home']"
    />
  </div>

  <!-- Search Section -->
  <div class="search-section">
    <input
      type="text"
      pInputText
      placeholder="Search..."
      [(ngModel)]="searchQuery"
      (input)="filterItems()"
      class="sidebar-search"
    />
    <i class="pi pi-search"></i>
    <!-- Search icon on the right -->
    <!-- </ng-template> -->
  </div>

  <!-- Menu Items Section -->
  <ul class="menu-items">
    <li
      *ngFor="let item of filteredItems"
      [class.active]="item.isActive"
      class="f-13"
    >
      <!-- Main Menu Item -->
      <a
        class="menu-item submenu-title cursor-pointer text-balance line-clamp-1 full-name"
        [routerLink]="item.module_route"
        *ngIf="item.subchildren.length >= 1"
        routerLinkActive="active"
        (click)="toggleSubMenu(item)"
        [ngClass]="item.isActive ? 'active-item' : ''"
      >
        <!-- Chevron Icon -->
        <i
          class="icon"
          [ngClass]="
            item.isOpen ? 'bx bx-chevron-up f-12' : 'bx bx-chevron-down f-12'
          "
        ></i>
        {{ item.parentModuleName }}
      </a>

      <a
        class="ml-3 submenu-title cursor-pointer text-balance line-clamp-1 full-name menu-item"
        [routerLink]="item.module_route"
        *ngIf="item.subchildren.length == 0"
        routerLinkActive="active"
        (click)="toggleSubMenu(item)"
        [ngClass]="item.isActive ? 'active-item' : ''"
      >
        <!-- Chevron Icon -->
        {{ item.parentModuleName }}
      </a>
      <!-- Submenu -->
      <ul *ngIf="item.isOpen" class="submenu">
        <li
          *ngFor="let subItem of item.subchildren"
          class="subsidebar child f-12 ms-7 menu-item"
        >
          <!-- <i class='bx bx-circle f-8'></i> -->
          <a
            [routerLink]="subItem.module_route"
            routerLinkActive="active"
            (click)="setActive(subItem, item)"
            [ngClass]="subItem.isActive ? 'active-item' : ''"
          >
            {{ subItem?.module_name }}
          </a>
        </li>
      </ul>
    </li>
  </ul>

  <!-- User Profile Section -->
  <div class="user-profile d-flex flex-row justify-between me-5 pe-3">
    <div class="flex flex-row mt-2 align-center">
      <img
        [src]="
          profilePhoto != '' && profilePhoto ? profilePhoto : '/man_4140048.png'
        "
        class="profile-image me-3 h-[40px] w-[40px] rounded-full"
      />
      <p class="user-name f-12 d-flex align-items-center">{{ userName }}</p>
    </div>

    <div
      class="cursor-pointer pi pi-ellipsis-v mt-2"
      (click)="onButtonClick($event)"
    ></div>

    <div class="flex h-full p-1 align-items-center me-4">
      <p-tieredmenu #menu [model]="items" [appendTo]="'body'" [popup]="true" />
    </div>
  </div>
</div>
