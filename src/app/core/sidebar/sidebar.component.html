<!-- sidebar.component.html -->
<nav
  class="h-full bg-white border-r border-gray-400 shadow-sm flex flex-col transition-all duration-300 ease-in-out text-[80%]"
  [ngClass]="collapsed ? 'w-14' : 'w-[250px]'"
  aria-label="Main sidebar"
>
  <!-- Menu -->
  <div class="flex-1 overflow-y-auto nice-scroll py-1.5 bg-gray-50/30">
    <ng-container *ngFor="let item of menu; trackBy: trackById">
      <!-- Header -->
      <div
        *ngIf="item.type === 'header'"
        class="px-3 py-0.5 text-[1px] font-semibold uppercase tracking-wide text-gray-500"
        [ngClass]="collapsed ? 'opacity-0 h-0 overflow-hidden' : 'mt-2.5'"
      >
        {{ item.label }}
      </div>

      <!-- Divider -->
      <div
        *ngIf="item.type === 'divider'"
        class="my-1.5 mx-2 border-t border-gray-200"
        [ngClass]="collapsed ? 'mx-1.5' : 'mx-2'"
      ></div>

      <!-- Single Link -->
      <a
        *ngIf="item.type?.toLowerCase() === 'link'"
        [routerLink]="!item.external ? item.route : null"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        [href]="item.external ? item.route : null"
        [attr.target]="item.external ? '_blank' : null"
        [attr.rel]="item.external ? 'noopener noreferrer' : null"
        class="group mx-1.5 my-0.5 flex items-center gap-2 rounded-md transition-all duration-200 text-gray-700 hover:bg-teal-100 hover:text-[#129990]"
        [ngClass]="collapsed ? 'px-1.5 py-1.5 justify-center' : 'px-2.5 py-1.5'"
        [attr.title]="collapsed ? item.label : null"
      >
        <!-- Icon -->
        <span
          class="inline-flex h-7 w-7 items-center justify-center rounded-md bg-teal-500 text-white group-hover:text-[#129990]"
        >
          <i class="text-[13px]" [ngClass]="item.icon"></i>
        </span>

        <!-- Label -->
        <span
          class="truncate text-sm font-medium"
          [ngClass]="collapsed ? 'hidden' : ''"
        >
          {{ item.label }}
        </span>

        <!-- Badge -->
        <span
          *ngIf="item.badge && !collapsed"
          class="ml-auto text-[11px] px-1.5 py-0.5 rounded-full font-semibold"
          [ngClass]="{
            'bg-green-100 text-green-700': item.badge.variant === 'success',
            'bg-yellow-100 text-yellow-700': item.badge.variant === 'warning',
            'bg-blue-100 text-blue-700': item.badge.variant === 'info'
          }"
        >
          {{ item.badge.text }}
        </span>
      </a>

      <!-- Group -->
      <div *ngIf="item.type.toLowerCase() === 'group'" class="mx-1.5 my-0.5">
        <button
          type="button"
          (click)="toggleGroup(item)"
          role="button"
          class="flex items-center w-full rounded-md transition-all duration-200 hover:bg-teal-100 hover:text-[#129990]"
          [ngClass]="
            collapsed ? 'px-1.5 py-1.5 justify-center' : 'px-2.5 py-1.5'
          "
          [attr.aria-expanded]="item.expanded"
          [attr.aria-controls]="'group-' + item.id"
          [attr.title]="collapsed ? item.label : null"
        >
          <!-- Icon -->
          <span
            class="inline-flex h-7 w-7 items-center justify-center rounded-md bg-teal-500 text-white"
          >
            <i class="text-[13px]" [ngClass]="item.icon"></i>
          </span>

          <!-- Label -->
          <span class="ml-2 text-sm" [ngClass]="collapsed ? 'hidden' : ''">
            {{ item.label }}
          </span>

          <!-- Chevron -->
          <i
            class="pi ml-auto transition-transform duration-200 text-teal-400"
            [ngClass]="{
              'pi-chevron-down rotate-0': item.expanded,
              'pi-chevron-right': !item.expanded,
              hidden: collapsed
            }"
            *ngIf="!collapsed"
          ></i>
        </button>

        <!-- Children -->
        <div
          *ngIf="item.expanded && !collapsed"
          [id]="'group-' + item.id"
          class="ml-2.5"
        >
          <ng-container *ngFor="let child of item.children; trackBy: trackById">
            <!-- Level 2 -->
            <a
              *ngIf="child.type?.toLowerCase() === 'link'"
              [routerLink]="child.route"
              class="group flex items-center gap-1.5 px-2 py-1.5 rounded hover:bg-gray-100 hover:text-[#129990] transition text-xs"
            >
              <i class="text-teal-400 text-[12px]" [ngClass]="child.icon"></i>
              <span class="truncate">{{ child.label }}</span>
            </a>

            <div *ngIf="child.children?.length > 0" class="ml-4">
              <ng-container
                *ngFor="let subchild of child.children; trackBy: trackById"
              >
                <!-- Level 3 -->
                <a
                  *ngIf="subchild.type?.toLowerCase() === 'link'"
                  [routerLink]="subchild.route"
                  class="group flex items-center gap-1.5 px-2 py-1.5 rounded hover:bg-gray-50 hover:text-[#129990] transition text-xs"
                >
                  <i
                    class="text-gray-400 text-[12px]"
                    [ngClass]="subchild.icon"
                  ></i>
                  <span class="truncate">{{ subchild.label }}</span>
                </a>

                <div *ngIf="subchild.children?.length > 0" class="ml-4">
                  <ng-container
                    *ngFor="let subsub of subchild.children; trackBy: trackById"
                  >
                    <!-- Level 4 -->
                    <a
                      *ngIf="subsub.type?.toLowerCase() === 'link'"
                      [routerLink]="subsub.route"
                      class="group flex items-center gap-1.5 px-2 py-1.5 rounded hover:bg-gray-50 hover:text-[#129990] transition text-xs"
                    >
                      <i
                        class="text-gray-400 text-[12px]"
                        [ngClass]="subsub.icon"
                      ></i>
                      <span class="truncate">{{ subsub.label }}</span>
                    </a>

                    <div *ngIf="subsub.children?.length > 0" class="ml-4">
                      <ng-container
                        *ngFor="
                          let subsubsub of subsub.children;
                          trackBy: trackById
                        "
                      >
                        <!-- Level 5 -->
                        <a
                          *ngIf="subsubsub.type?.toLowerCase() === 'link'"
                          [routerLink]="subsubsub.route"
                          class="group flex items-center gap-1.5 px-2 py-1.5 rounded hover:bg-gray-50 hover:text-[#129990] transition text-xs"
                        >
                          <i
                            class="text-gray-400 text-[12px]"
                            [ngClass]="subsubsub.icon"
                          ></i>
                          <span class="truncate">{{ subsubsub.label }}</span>
                        </a>
                      </ng-container>
                    </div>
                  </ng-container>
                </div>
              </ng-container>
            </div>
          </ng-container>
        </div>
      </div>
    </ng-container>
  </div>

  <!-- Footer -->
  <div
    class="p-2 border-t border-gray-200 text-[10px] text-gray-400 text-center bg-gray-50"
    [ngClass]="collapsed ? 'hidden' : ''"
  >
    © 2025 Scope 2.0
  </div>
</nav>
