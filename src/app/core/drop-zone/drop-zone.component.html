<div
  class="max-w-[200px] h-[200px] p-4 flex items-center justify-center text-center text-gray-400 border-4 border-dashed border-green-600 rounded-lg cursor-pointer transition-colors"
  [class.border-solid]="isDragging"
  (click)="onClick()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave()"
  (drop)="onDrop($event)"
>
  <!-- Hidden file input -->
  <input
    type="file"
    #fileInput
    class="hidden"
    (change)="onFileSelected($event)"
  />

  <!-- Preview Thumbnail -->
  <ng-container *ngIf="file; else prompt">
    <div
      class="w-full h-full rounded-lg overflow-hidden bg-gray-300 bg-cover bg-center relative"
      [style.background-image]="previewUrl ? 'url(' + previewUrl + ')' : ''"
    >
      <div class="absolute bottom-0 left-0 w-full bg-black bg-opacity-75 text-white text-sm p-1 truncate">
        {{ file.name }}
      </div>
    </div>
  </ng-container>

  <!-- Prompt -->
  <ng-template class="flex flex-col" #prompt>
    <i class="pi pi-cloud-upload upload" style="color: #008080"></i>
  </ng-template>
</div>

<!-- Buttons -->
<div class="flex gap-2 mt-3" *ngIf="file">
  <button
    (click)="uploadFile()"
    class="px-3 py-1 bg-green-600 text-white rounded hover:bg-green-700 transition"
  >
    Upload
  </button>
  <button
    (click)="cancelUpload()"
    class="px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700 transition"
  >
    Cancel
  </button>
</div>
