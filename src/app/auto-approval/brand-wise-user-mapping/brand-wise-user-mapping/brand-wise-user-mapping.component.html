<div class="min-w-full bg-gray-100">
  <!-- <h1 class="text-2xl font-serif ml-2">Brand Wise User Mapping</h1> -->
  <div class="min-w-full !min-h-auto flex items-center justify-start px-2">
    <div
      class="min-w-full min-h-[15vh] flex-wrap flex p-2 gap-3 items-center border-dashed border-2 bg-gray-50 border-gray-200"
      [formGroup]="BrandUserMapping"
    >
      <!-- Brand MultiSelect -->
      <p-floatlabel variant="on">
        <p-multiselect
          [options]="BrandData"
          optionLabel="vcbrand"
          optionValue="bigid"
          [showClear]="true"
          size="small"
          class="w-44"
          formControlName="Brand"
          (onChange)="OnclickBrands()"

        />
        <label for="parameters" class="text-xs">Select Brand</label>
      </p-floatlabel>

      <!-- Dealer MultiSelect -->
      <p-floatlabel variant="on">
        <p-multiselect
          [options]="DealerData"
          optionLabel="Dealer"
          optionValue="DealerID"
          [showClear]="true"
          size="small"
          appendTo="body"
          class="w-44"
          formControlName="Dealer"
          (onChange)="OnclickDealer()"
        />
        <label for="parameters" class="text-xs">Select Dealer</label>
      </p-floatlabel>

      <!-- Location MultiSelect -->
      <p-floatlabel variant="on">
        <p-multiselect
          [options]="LocationData"
          optionLabel="Location"
          optionValue="LocationID"
          size="small"
          class="w-44"
           appendTo="body"
          formControlName="Location"
        />
        <label for="parameters" class="text-xs">Select Location</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <p-multiselect
          [size]="'small'"
          optionLabel="Name"
          optionValue="bintId_Pk"
          [options]="UserData"
          class="!w-44 !h-8"
          id="parameters"
          size="small"
          formControlName="AssignedUser"
        />
        <label for="parameters" class="text-xs"> Assign User</label>
      </p-floatlabel>

      <p-button
        size="small"
        [style]="{ 'background-color': '#008080', color: '#fff' }"
        icon="pi pi-check"
        iconPos="right"
        (onClick)="onClickSave()"
      />
      <p-button
        size="small"
        label="View User Mapping"
        [style]="{ 'background-color': '#008080', color: '#fff' }"
        icon="pi pi-table"
        iconPos="right"
        
      />
    </div>
  </div>

  <!-- View User Mapping Table -->

  <div
    class="m-2 flex flex-col items-center rounded-lg bg-white shadow-lg p-2"
    
  >
    <div class="bg-gray-50 h-auto rounded-lg shadow-lg w-full overflow-hidden">
      <p-table
        [scrollable]="true"
        scrollHeight="600px"
        [showGridlines]="true"
        scrollDirection="both"
        class="!w-[90vw]"
        [tableStyle]="{ 'min-width': '50rem' }"
      >
        <ng-template #header>
          <tr class="">
            <th
              class="!px-1 flex-auto !py-1 !text-center text-[12px] !bg-gray-300 !max-w-[60px] !min-h-[22px]"
            >
              S.No
            </th>
            <th
              class="!px-1 flex-2 !py-1 !text-center text-[12px] !bg-gray-300 !max-w-[60px]"
            >
              Brand
              <p-columnFilter type="text" field="" display="menu" />
            </th>
            <th
              class="!px-1 !py-1 !text-center text-[12px] !bg-gray-300 !min-w-[60px]"
            >
              Dealer
            </th>
            <th
              class="!px-1 !py-1 !text-center text-[12px] !bg-gray-300 !min-w-[60px]"
            >
              Location
            </th>
            <th
              class="!px-1 !py-1 !text-center text-[12px] !bg-gray-300 !min-w-[60px]"
            >
              Assigned User
            </th>
            <th
              class="!px-1 !py-1 !text-center text-[12px] !bg-gray-300 font-semibold !min-w-[60px]"
            >
              Status
            </th>
            <th
              class="!px-1 !py-1 !text-center text-[12px] !bg-gray-300 font-semibold !min-w-[60px]"
            >
              Action
            </th>
          </tr>
        </ng-template>

        <ng-template #body let-rowData let-i="rowIndex">
          <tr
            class="!border-b hover:!shadow-xl !hover:!border-2 !transition duration-100 transform hover:-translate-y-1 active:translate-y-0"
          >
            <td class="p-1 text-[10px] text-center">{{ i + 1 }}</td>
            <td
              class="!px-1 !py-1 !text-center !h-[20px] text-[13px] text-gray-700"
            >
              {{ rowData.Dashboard }}
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
