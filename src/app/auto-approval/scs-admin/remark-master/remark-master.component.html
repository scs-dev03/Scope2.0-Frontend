<div class="min-w-full bg-gray-100">
  <h1 class="text-2xl font-serif ml-2">Remark Master</h1>
  <div class="min-w-full !min-h-auto flex items-center justify-start px-2">
    <div
      class="min-w-full min-h-[15vh] flex-wrap flex p-2 gap-3 items-center rounded bg-gray-50"
    >
      <div class="flex flex-wrap gap-4">
        <form [formGroup]="remarkForm">
          <div class="flex flex-wrap gap-4">
            <p-floatlabel variant="on">
              <p-select
                optionLabel="name"
                formControlName="user"
                size="small"
                class="w-44 h-8"
              />
              <label class="text-xs">User</label>
            </p-floatlabel>

            <p-floatlabel variant="on">
              <p-select
                optionLabel="name"
                formControlName="brand"
                size="small"
                class="w-44 h-8"
              />
              <label class="text-xs">Select Brand</label>
            </p-floatlabel>

            <p-floatlabel variant="on">
              <p-select
                optionLabel="name"
                formControlName="dealer"
                size="small"
                class="w-44 h-8"
              />
              <label class="text-xs">Select Dealer</label>
            </p-floatlabel>

            <p-floatlabel variant="on">
              <p-select
                optionLabel="name"
                formControlName="location"
                size="small"
                class="w-44 h-8"
              />
              <label class="text-xs">Select Location</label>
            </p-floatlabel>

            <p-floatlabel variant="on">
              <input
                type="text"
                class="h-8 w-52"
                id="keyworinput"
                pSize="small"
                pInputText
                formControlName="remark"
              />
              <label for="keyworinput" class="text-xs">Enter Remark</label>
            </p-floatlabel>

            <p-button
              size="small"
              label="Save"
              [style]="{ 'background-color': '#008080', color: '#fff' }"
              icon="pi pi-check"
              iconPos="left"
              (onClick)="onSave()"
            />
            <p-button
              size="small"
              label="View"
              [style]="{ 'background-color': '#008080', color: '#fff' }"
              icon="pi pi-eye"
              iconPos="left"
              (onClick)="onClickViewRemarkTable()"
            />
          </div>
        </form>
      </div>
    </div>
  </div>
  <div
    class="m-2 flex flex-col items-center rounded-lg bg-white shadow-lg p-2"
    *ngIf="showTable"
  >
    <div class="bg-gray-50 h-auto rounded-lg shadow-lg w-full overflow-hidden">
      <p-table
        [scrollable]="true"
        scrollHeight="600px"
        [showGridlines]="true"
        scrollDirection="both"
        class="!w-[90vw]"
        [tableStyle]="{ 'min-width': '50rem' }"
      >
        <ng-template #header>
          <tr class="">
            <th
              class="!px-1 flex-auto !py-1 !text-center text-[12px] !bg-gray-300 !max-w-[60px] !min-h-[22px]"
            >
              S.No
            </th>
            <th
              class="!px-1 flex-2 !py-1 !text-center text-[12px] !bg-gray-300 !max-w-[60px]"
            >
              Brand
              <p-columnFilter type="text" field="" display="menu" />
            </th>
            <th
              class="!px-1 !py-1 !text-center text-[12px] !bg-gray-300 !min-w-[60px]"
            >
              Dealer
            </th>
            <th
              class="!px-1 !py-1 !text-center text-[12px] !bg-gray-300 !min-w-[60px]"
            >
              Location
            </th>
            <th
              class="!px-1 !py-1 !text-center text-[12px] !bg-gray-300 !min-w-[60px]"
            >
              User
            </th>
            <th
              class="!px-1 !py-1 !text-center text-[12px] !bg-gray-300 font-semibold !min-w-[60px]"
            >
              Status
            </th>
            <th
              class="!px-1 !py-1 !text-center text-[12px] !bg-gray-300 font-semibold !min-w-[60px]"
            >
              Action
            </th>
          </tr>
        </ng-template>

        <ng-template #body let-rowData let-i="rowIndex">
          <tr
            class="!border-b hover:!shadow-xl !hover:!border-2 !transition duration-100 transform hover:-translate-y-1 active:translate-y-0"
          >
            <td class="p-1 text-[10px] text-center">{{ i + 1 }}</td>
            <td
              class="!px-1 !py-1 !text-center !h-[20px] text-[13px] text-gray-700"
            >
              {{ rowData.Dashboard }}
            </td>
          </tr>
        </ng-template>
      </p-table>
      <p-paginator
        class="h-6 text-sm"
        (onPageChange)="onPageChange($event)"
        [first]="first"
        [rows]="rows"
        dropdownAppendTo="body"
        [totalRecords]="120"
        [rowsPerPageOptions]="[10, 20, 30]"
      />
    </div>
  </div>
</div>
