<div class="min-w-full">
  <div class="min-w-full !min-h-auto flex items-center justify-start px-2">
    <div
      class="min-w-full min-h-[15vh] flex-wrap flex p-2 gap-3 items-center rounded"
      [formGroup]="InnerDashboardInputData"
    >
      <div class="flex flex-wrap gap-4">
        <!-- Location -->
        <div class="flex flex-col h-11">
          <p-floatlabel
            class="w-full sm:w-44 md:w-52 lg:w-[185px]"
            variant="on"
          >
            <p-select
              [showClear]="true"
              size="small"
              class="w-full h-8"
              [options]="LocationData"
              formControlName="Location"
              optionValue="locationid"
              optionLabel="location"
            />
            <label class="text-xs">Location</label>
          </p-floatlabel>
        </div>

        <!-- From Date -->
        <div class="flex flex-col h-11">
          <p-floatlabel
            class="w-full sm:w-44 md:w-52 lg:w-[185px]"
            variant="on"
          >
            <input
              pInputText
              formControlName="FromDate"
              id="fromDate"
              type="date"
              [max]="today"
              [value]="firstDayOfMonth"
              class="w-full h-8"
            />
            <label for="fromDate" class="text-xs">From Date</label>
          </p-floatlabel>
        </div>

        <!-- To Date -->
        <div class="flex flex-col h-11">
          <p-floatlabel
            class="w-full sm:w-44 md:w-52 lg:w-[185px]"
            variant="on"
          >
            <input
              pInputText
              formControlName="ToDate"
              type="date"
              [max]="today"
              class="w-full h-8"
            />
            <label for="ToDate" class="text-xs">To Date</label>
          </p-floatlabel>
        </div>

        <!-- Order Type -->
        <div class="flex flex-col h-11">
          <p-floatlabel
            class="w-full sm:w-44 md:w-52 lg:w-[185px]"
            variant="on"
          >
            <p-select
              [showClear]="true"
              size="small"
              class="w-full h-8"
              formControlName="OrderType"
              [options]="OrderTypeData"
              optionValue="Id"
              optionLabel="Name"
            />
            <label class="text-xs">Select Order Type</label>
          </p-floatlabel>
        </div>

        <!-- Pending Since -->
        <p-floatlabel variant="on">
          <p-select
            formControlName="selectedPeriod"
            [options]="periodOptions"
            optionLabel="name"
            optionValue="value"
            size="small"
            class="w-44 h-8"
            (onChange)="OnChangeDate()"
          />
          <label class="text-xs">Pending Since</label>
        </p-floatlabel>

        <!-- Button -->
        <p-button
          size="small"
          label="View"
          [style]="{ 'background-color': '#008080', color: '#fff' }"
          icon="pi pi-eye"
          iconPos="left"
          (onClick)="OnClickViewData()"
        />
      </div>
    </div>
  </div>

  <!-- ✅ CARDS SECTION (now inside the main container) -->
  <div
    class="min-w-full flex justify-center items-center flex-wrap gap-5 p-2 mt-2"
    *ngIf="DashboardData"
  >
    <div
      class="w-52 h-32 bg-yellow-100 border border-slate-200 rounded-xl shadow-sm flex flex-col items-center justify-center text-center hover:shadow-[0_30px_80px_rgba(2,6,23,0.25)] transition-all duration-300 hover:-translate-y-0.5"
    >
      <div class="text-4xl font-semibold text-slate-900 tabular-nums">
        {{ DashboardData.NotInMaster }}
      </div>
      <div class="mt-1 text-[15px] uppercase tracking-wide text-slate-500">
        Not in master
      </div>
    </div>

    <div
      class="w-52 h-32 bg-red-200 border border-slate-200 rounded-xl shadow-sm flex flex-col items-center justify-center text-center hover:shadow-[0_30px_80px_rgba(2,6,23,0.25)] transition-all duration-300 hover:-translate-y-0.5"
    >
      <div class="text-4xl font-semibold text-slate-900 tabular-nums">
        {{ DashboardData.Decline }}
      </div>
      <div class="mt-1 text-[15px] uppercase tracking-wide text-slate-500">
        Rejected
      </div>
    </div>

    <div
      class="w-52 h-32 bg-green-200 border border-slate-200 rounded-xl shadow-sm flex flex-col items-center justify-center text-center hover:shadow-[0_30px_80px_rgba(2,6,23,0.25)] transition-all duration-300 hover:-translate-y-0.5"
    >
      <div class="text-4xl font-semibold text-slate-900 tabular-nums">
        {{ DashboardData.Approve }}
      </div>
      <div class="mt-1 text-[15px] uppercase tracking-wide text-slate-500">
        Approved
      </div>
    </div>

    <div
      class="w-52 h-32 bg-blue-200 border border-slate-200 rounded-xl shadow-sm flex flex-col items-center justify-center text-center hover:shadow-[0_30px_80px_rgba(2,6,23,0.25)] transition-all duration-300 hover:-translate-y-0.5"
    >
      <div class="text-4xl font-semibold text-slate-900 tabular-nums">
        {{ DashboardData.PendingCount }}
      </div>
      <div class="mt-1 text-[15px] uppercase tracking-wide text-slate-500">
        Pending
      </div>
    </div>

    <div
      class="w-52 h-32 bg-violet-200 border border-slate-200 rounded-xl shadow-sm flex flex-col items-center justify-center text-center hover:shadow-[0_30px_80px_rgba(2,6,23,0.25)] transition-all duration-300 hover:-translate-y-0.5"
    >
      <div class="text-4xl font-semibold text-slate-900 tabular-nums">
        {{ DashboardData.Internal }}
      </div>
      <div class="mt-1 text-[15px] uppercase tracking-wide text-slate-500">
        Pending At Internal Approver
      </div>
    </div>
  </div>
</div>

<p-dialog
  header="Message"
  [(visible)]="visible"
  [modal]="true"
  [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
  [style]="{ width: '50vw' }"
  [draggable]="false"
  [resizable]="false"
>
  <p class="text-lg">
    {{ Result }}
  </p>
</p-dialog>
