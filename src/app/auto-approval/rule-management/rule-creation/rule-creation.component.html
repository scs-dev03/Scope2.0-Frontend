<div class="min-w-full h-full bg-gray-100">
  <h1 class="text-2xl font-serif ml-2">Rule Creation</h1>
  <div class="flex flex-wrap gap-4 p-2">
    <div class="flex">
      <p-radiobutton name="pizza" value="Cheese" inputId="ingredient1" />
      <label for="Numeric" class="ml-2 text-sm">Numeric Rule</label>
    </div>

    <div class="flex">
      <p-radiobutton name="pizza" value="" inputId="ingredient2" />
      <label for="alphanumeric" class="ml-2 text-sm">Alpha Numeric Rule</label>
    </div>
  </div>
  <div class="flex flex-wrap w-full p-2 gap-5">
    <p-floatlabel variant="on">
      <input type="text" id="rulename" pSize="small" pInputText />
      <label for="rulename" class="text-xs">Name of Rule Name</label>
    </p-floatlabel>

    <p-floatlabel variant="on">
      <input type="text" id="description" pSize="small" pInputText />
      <label for="description" class="text-xs">Description</label>
    </p-floatlabel>
  </div>
  <br />

  <div class="min-w-full !min-h-[100px] flex items-center justify-start px-2">
    <div
      class="min-w-full min-h-[50px] flex-col flex-wrap p-2 gap-3 items-stretch border-dashed border-2 bg-gray-50 border-gray-200"
    >
      <h1>Numeric Rule Creation</h1>
      <br />
      <div class="min-h-auto flex flex-wrap items-center justify-start p-2 gap-2 border bg-gray-50 border-gray-200">
        <p-floatlabel variant="on">
          <p-select
            size="small"
            [options]="parameters"
            [(ngModel)]="selectedParameter"
            optionValue="value"
            optionLabel="label"
            styleClass="w-44"
          />
          <label for="parameter" class="text-sm">Bucket</label>
        </p-floatlabel>
        <p-floatlabel variant="on">
          <p-select
            size="small"
            [options]="parameters"
            [(ngModel)]="selectedParameter"
            optionValue="value"
            optionLabel="label"
            styleClass="w-44"
          />
          <label for="parameter" class="text-sm">Parameters</label>
        </p-floatlabel>
        <p-floatlabel variant="on">
          <p-select
            size="small"
            [options]="operators"
            [(ngModel)]="selectedOperator"
            optionValue="value"
            optionLabel="label"
            styleClass="w-44"
          />
          <label for="operator" class="text-sm">List of operators</label>
        </p-floatlabel>

        <input
          type="number"
          size="small"
          [(ngModel)]="enteredValue"
          placeholder="Enter Value (Optional)"
          class="p-inputtext h-8 w-44"
        />
        <p-button
          label="Add to Rule"
          size="small"
          (click)="appendToRule()"
          
        />
      </div>
      <br>
      <div>
        <p>Expression: {{ expression }}</p>
      </div>

      <!-- second rule window -->
    </div>
  </div>
  <br><br><br>
  <div class="min-w-full !min-h-[100px] flex items-center p-2">
    <div
      class="min-w-full min-h-[150px] flex-col flex-wrap p-2 border-dashed border-2 bg-gray-50 border-gray-200"
    >
      <h1>Alpha-Numeric Rule Creation</h1>
      <br />
      <div class="min-h-auto flex flex-wrap items-center justify-start p-2 gap-x-2 gap-y-4 border bg-gray-50 border-gray-200">
        <p-floatlabel  variant="on">
          <p-select
            size="small"
            [options]="parameters"
            [(ngModel)]="selectedParameter"
            optionValue="value"
            optionLabel="label"
            styleClass="w-44" 
          />
          <label for="parameter" class="text-sm">Bucket </label>
        </p-floatlabel>
        <p-floatlabel variant="on">
          <p-select
            size="small"
            [options]="parameters"
            [(ngModel)]="selectedParameter"
            optionValue="value"
            optionLabel="label"
            styleClass="w-44" 
          />
          <label for="parameter" class="text-sm">Parameters</label>
        </p-floatlabel>
        <p-floatlabel variant="on">
          <p-select
            size="small"
            [options]="parameters"
            [(ngModel)]="selectedParameter"
            optionValue="value"
            optionLabel="label"
            styleClass="w-44" 
          />
          <label for="parameter" class="text-sm">keyword</label>
        </p-floatlabel>
        <p-floatlabel variant="on">
          <p-select
            size="small"
            [options]="operators"
            [(ngModel)]="selectedOperator"
            optionValue="value"
            optionLabel="label"
            styleClass="w-44" 
          />
          <label for="operator" class="text-sm">List of operators</label>
        </p-floatlabel>

        <input
          type="number"
          size="small"
          [(ngModel)]="enteredValue"
          placeholder="Enter Value (Optional)"
          class="p-inputtext w-44 !text-sm  h-8"
        />
        <p-button
          label="Add to Rule"
          size="small"
          (click)="appendToRule()"
          class=""
          
        />
        <p-button
          label="Clear Rule"
          size="small"
          (click)="clearRule()"
          class=""
          
        />
      </div>
      <br>
      <div>
        <p>Expression: {{ expression }}</p>
      </div>

      <!-- second rule window -->
    </div>
  </div>
</div>
