<!-- <app-loader [isloading]="isloading"></app-loader> -->
<div class="w-full h-full">
  <!-- <div>
        <h1 class="text-3xl ml-10 font-semibold">Parts Ledger</h1>
      </div> -->

  <div class="flex flex-wrap -mt-10">
    <form
      action=""
      [formGroup]="DealerSalesReportInputData"
      class="flex flex-1 flex-wrap p-5 justify-start items-center gap-3 w-auto"
    >
      <div class="w-32 relative">
        <p-floatlabel variant="on">
          <p-select
            inputId="LocationID"
            formControlName="LocationID"
            [options]="LocationData"
            optionValue="locationid"
            [showClear]="true"
            optionLabel="location"
            scrollHeight="150px"
            appendTo="body"
            filterBy="location"
            class="!w-full !text-[10px]"
          />
          <label for="LocationID" class="text-[10px]">Locations</label>
        </p-floatlabel>
        <div
          *ngIf="
            DealerSalesReportInputData.get('LocationID')?.invalid &&
            (DealerSalesReportInputData.get('LocationID')?.dirty ||
              DealerSalesReportInputData.get('LocationID')?.touched)
          "
          class="text-red-500 text-[10px] absolute left-0"
        >
          This field is mandatory
        </div>
      </div>

      <div class="w-32 relative">
        <p-floatlabel variant="on">
          <p-datepicker
            inputId="FormDate"
            view="month"
            formControlName="FormDate"
            size="small"
            dateFormat="mm/yy"
            [showIcon]="false"
            [minDate]="minDate"
            [maxDate]="maxDate"
            class="w-full"
          />
          <label for="FormDate" class="text-[10px]">From Month</label>
          <div
            *ngIf="
              DealerSalesReportInputData.get('FormDate')?.invalid &&
              (DealerSalesReportInputData.get('FormDate')?.dirty ||
                DealerSalesReportInputData.get('FormDate')?.touched)
            "
            class="text-red-500 text-[10px] absolute left-0"
          >
            This field is mandatory
          </div>
        </p-floatlabel>
      </div>
      <div class="w-32 relative">
        <p-floatlabel variant="on">
          <p-datepicker
            view="month"
            formControlName="ToDate"
            size="small"
            [showIcon]="true"
            [showIcon]="false"
            [minDate]="minDate"
            [maxDate]="maxDate"
            dateFormat="mm/yy"
          />

          <label for="ToDate" class="text-[10px]">To Month</label>
          <div
            *ngIf="
              DealerSalesReportInputData.get('ToDate')?.invalid &&
              (DealerSalesReportInputData.get('ToDate')?.dirty ||
                DealerSalesReportInputData.get('ToDate')?.touched)
            "
            class="text-red-500 text-[10px] absolute left-0"
          >
            This field is mandatory
          </div>
        </p-floatlabel>
      </div>

      <div class="w-32 relative">
        <p-floatlabel variant="on">
          <p-multiselect
            [options]="DataType"
            inputId="datatype"
            formControlName="DataType"
            optionValue="name"
            optionLabel="name"
            scrollHeight="150px"
            filterBy="name"
            class="!w-full !text-[10px]"
          />
          <label for="Datatype" class="text-[10px]">Data Type</label>
          <div
            *ngIf="
              DealerSalesReportInputData.get('DataType')?.invalid &&
              (DealerSalesReportInputData.get('DataType')?.dirty ||
                DealerSalesReportInputData.get('DataType')?.touched)
            "
            class="text-red-500 text-[10px] absolute left-0"
          >
            This field is mandatory
          </div>
        </p-floatlabel>
      </div>

      <div class="relative w-44">
        <p-floatlabel variant="on">
          <input
            id="PartNumber"
            type="text"
            pInputText
            pTooltip="Example: xyz, abc, prqs"
            tooltipPosition="top"
            size="small"
            class="w-full !text-xs !h-9"
            formControlName="PartNumber"
          />
          <label for="PartNumber" class="text-[10px]">Part Number</label>
        </p-floatlabel>

        <!-- Helper text (fixed just below input) -->
        <div class="text-[10px] text-green-600 absolute left-0 mt-1">
          <p class="ml-2">Multiparts Allowed with ,</p>
        </div>

        <!-- Validation message absolutely positioned below helper text -->
        <div
          *ngIf="
            DealerSalesReportInputData.get('PartNumber')?.invalid &&
            (DealerSalesReportInputData.get('PartNumber')?.dirty ||
              DealerSalesReportInputData.get('PartNumber')?.touched)
          "
          class="text-red-500 ml-2 text-[10px] absolute left-0"
          style="top: 3.5rem"
        >
          This field is mandatory
        </div>
      </div>

      <p-button
        label="Submit"
        severity="success"
        size="small"
        (onClick)="onSubmitAdminInputData()"
        [style]="{ 'background-color': '#008080', color: '#fff' }"
      />
      <p-button
        size="small"
        icon="pi pi-upload"
        (onClick)="onClickShowUpload()"
        [style]="{ 'background-color': '#008080', color: '#fff' }"
        label="Upload Excel"
      />
      <p-button
        size="small"
        icon="pi pi-download"
        (onClick)="exportPartNumberExcel()"
        [style]="{ 'background-color': '#008080', color: '#fff' }"
        label="Sample Format Download"
      />
    </form>
  </div>
  <div class="ml-10">
    <h1 class="font-semibold text-lg">Parts Description</h1>
  </div>

  <div class="w-full h-auto flex justify-start items-center !p-4">
    <app-product-desctiption-table
      [PartDetails]="PartDetail"
      class="!w-full"
    ></app-product-desctiption-table>
  </div>
  <div class="flex flex-row justify-between w-full">
    <div class="ml-10">
      <h1 class="font-semibold text-lg">Parts Sales Info</h1>
    </div>
    <div class="flex gap-3 mr-10">
      <p-button
        label="Export Data"
        size="small"
        [style]="{ 'background-color': '#008080', 'color': '#fff'}"
        [disabled]="exportVisible"
        (onClick)="exportToExcel()"
      />
    </div>
  </div>
  <div
    class="w-full h-auto flex justify-start items-center !p-4"
    *ngIf="SalesInfoVisible"
  >
    <app-product-sale-info
      [SalesInfo]="SalesInfo[0]"
      class="!w-full"
      [DataTypeArray]="DataTypeArray"
    ></app-product-sale-info>
  </div>
  <div class="ml-10">
    <h1 class="font-semibold text-lg" *ngIf="istotal">Total Sales</h1>
  </div>
  <div
    class="w-full h-auto flex justify-start items-center !p-4"
    *ngIf="istotal"
  >
    <app-totalsum
      [SalesInfo]="SalesInfo[1]"
      class="!w-full"
      [DataTypeArray]="DataTypeArray"
    ></app-totalsum>
  </div>
</div>

<!-- it is for error Message -->
<p-dialog
  header="Message"
  [(visible)]="visible"
  [modal]="true"
  [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
  [style]="{ width: '30vw' }"
  [draggable]="false"
  [resizable]="false"
>
  <p class="text-lg font-semibold">
    {{ Result }}
  </p>
</p-dialog>

<p-dialog
  header="Upload"
  [(visible)]="showupload"
  class="!w-auto !h-auto bg-slate-500 gap-16"
>
  <div class="flex gap-5">
    <div class="flex flex-col">
      <p-fileupload
        #fu
        mode="basic"
        chooseLabel="Parts Excel"
        chooseIcon="pi pi-upload"
        name="excelFile"
        accept=".xls,.xlsx"
        maxFileSize="5000000"
        [auto]="false"
        (onSelect)="onFileSelect($event)"
      />
      <!-- <span class="text-sm">{{ selectedFileName }}</span> -->
    </div>
    <p-button
      label="Upload"
      (onClick)="UploadPartNumber()"
      severity="secondary"
      size="small"
    />
  </div>
</p-dialog>
